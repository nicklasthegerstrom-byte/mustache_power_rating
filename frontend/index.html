<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mustachkampens mustaschanalys</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <img src="/assets/abbe/logo.png" alt="Mustaschkampen" class="logo">

        <div class="card" id="upload-card">
            <label for="file-input" class="upload-label">
                <span>Ladda upp din bild</span>
                <input type="file" id="file-input" accept="image/*">
            </label>
            <img id="preview" hidden>
            <button id="analyze-btn" hidden>🔬 Analysera</button>
        </div>

        <div class="card" id="result-card" hidden>
            <img id="result-image">
            <div id="result-text">
                <h2 id="result-title"></h2>
                <p id="result-score"></p>
            </div>
        </div>
    </main>
    <script src="script.js"></script>
</body>
</html>
